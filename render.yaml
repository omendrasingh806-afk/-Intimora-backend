# Render deployment config for the content site.
#
# `startCommand` is the PERSISTENT entrypoint, not `npm start`: on Render the
# process lives for days, so the MTProto session is opened once at boot and kept
# warm by the keepalive ping (with an automatic reconnect when it breaks). The
# serverless entrypoint stays untouched for Vercel/Netlify.
#
# Render injects PORT itself, so it is not set here. On the free plan the service
# sleeps after 15 minutes without traffic, which would also drop the socket —
# backend/persistent.js therefore pings its own /api/health using
# RENDER_EXTERNAL_URL to stay awake. Set MTPROTO_KEEPALIVE_MS to change the
# Telegram ping interval (default 60000) and SELF_PING_MS=0 to disable the
# self-ping.
#
# Env var values are NOT stored here — set them in the Render dashboard:
#   TELEGRAM_API_ID, TELEGRAM_API_HASH, TELEGRAM_SESSION,
#   TELEGRAM_CHANNEL_VIDEO, TELEGRAM_CHANNEL_THUMB, TELEGRAM_CHANNEL_META,
#   TELEGRAM_CHANNEL_USERS, TELEGRAM_CHANNEL_REFERRALS, TELEGRAM_CHANNEL_PREMIUM,
#   TELEGRAM_CHANNEL_ACCOUNTS, FIREBASE_API_KEY, ADMIN_API_KEY, PREMIUM_SECRET
services:
  - type: web
    name: content-site
    runtime: node
    plan: free
    # This service uses its own MTProto session, and one session may be held by
    # exactly one process: a second instance on the same auth key makes Telegram
    # deactivate it ("concurrent usage"). Every other host (Vercel, the PHP
    # hosts) keeps its own separate session and serves its visitors itself.
    numInstances: 1
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm run start:persistent
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION
        sync: false
      - key: TELEGRAM_CHANNEL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
